<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AiLGNS">
<meta name="shell-ver" content="8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png?v=hx2">
<title>AiLGNS</title>
<style>
  /* 📣 发布页风格（站长 2026-11-09：参考「永久地址发布页」做法）：大标题、一排大按钮网址、谁能用一眼看懂；配色仍用站内浅紫，不做深色 */
  :root { --ink: #1f1a33; --muted: #8a80a8; --line: #ece7f7; --purple: #5a35d6; --grad: linear-gradient(135deg, #7c3aed, #4f46e5); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; background: linear-gradient(180deg, #f6f1ff 0%, #ffffff 40%); color: var(--ink); touch-action: manipulation; -webkit-text-size-adjust: 100%; padding: max(10px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom)); }
  .top { display: flex; align-items: center; justify-content: space-between; height: 40px; max-width: 560px; margin: 0 auto; }
  .top img { width: 28px; height: 28px; border-radius: 8px; }
  .top b { font-size: 14px; color: var(--muted); font-weight: 600; }
  .st { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .st i { width: 8px; height: 8px; border-radius: 50%; background: #d6ccf2; display: inline-block; } .st.ok i { background: #0ecb81; } .st.bad i { background: #f6465d; }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding: 8px 0 20px; }
  .hero { text-align: center; padding: 10px 0 0; }
  .hero h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: 1px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 8px 0 0; font-size: 15px; color: #4a3f6b; font-weight: 600; }
  .hero p b { color: #d9480f; }
  .enter { display: block; text-align: center; background: var(--grad); color: #fff; font-weight: 900; font-size: 20px; padding: 18px; border-radius: 16px; text-decoration: none; box-shadow: 0 12px 28px rgba(90,53,214,.28); }
  .enter small { display: block; font-weight: 500; font-size: 12px; opacity: .85; margin-top: 4px; }
  .sec h2 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; text-align: center; letter-spacing: .5px; }
  .doms { display: flex; flex-direction: column; gap: 10px; }
  .dom { display: flex; align-items: center; gap: 10px; padding: 14px 14px; border-radius: 14px; background: #fff; border: 2px solid var(--line); text-decoration: none; color: var(--ink); font-size: 18px; font-weight: 800; letter-spacing: .3px; box-shadow: 0 4px 14px rgba(31,26,51,.05); }
  .dom i { width: 10px; height: 10px; border-radius: 50%; background: #d6ccf2; flex: none; } .dom.ok i { background: #0ecb81; box-shadow: 0 0 0 4px rgba(14,203,129,.15); } .dom.bad i { background: #f6465d; opacity: .6; } .dom.wait i { animation: blink 1s infinite; }
  .dom.bad { color: var(--muted); font-weight: 600; text-decoration: line-through; } .dom.hot, .dom.best { border-color: #b69cff; background: #f6f1ff; }
  .dom .h { flex: 1; text-align: left; word-break: break-all; } .dom .tag { font-size: 11px; font-weight: 700; color: #0a8f5c; background: #e6fbf1; border-radius: 999px; padding: 2px 8px; flex: none; }
  .dom button { border: 1px solid var(--line); background: #fff; color: var(--purple); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; flex: none; }
  @keyframes blink { 50% { opacity: .3; } }
  .wl { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .wl a { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); font-size: 12px; width: 60px; }
  .wl img { width: 46px; height: 46px; border-radius: 14px; box-shadow: 0 4px 12px rgba(31,26,51,.10); background: #fff; }
  .wl span { white-space: nowrap; }
  .grp { padding: 16px 14px; border-radius: 16px; background: #fff; border: 2px solid #d9c9ff; text-align: center; }
  .grp h2 { margin: 0 0 10px; font-size: 17px; color: var(--purple); }
  .qr { display: block; margin: 0 auto; width: 200px; height: auto; border-radius: 12px; border: 1px solid var(--line); }
  .foot { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.7; margin: 6px 0 0; }
  .foot a { color: var(--purple); text-decoration: none; font-weight: 600; }
  .ask { border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px 10px; background: #fff; }
  .ask input { width: 100%; border: 0; outline: 0; font-size: 16px; padding: 4px 2px 8px; background: transparent; color: var(--ink); }
  .ask input::placeholder { color: #b3abc9; }
  .ask .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ask .hint { font-size: 12px; color: var(--muted); }
  .ask button { border: 0; border-radius: 999px; background: var(--purple); color: #fff; font-weight: 700; padding: 8px 16px; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #1f1a33; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
</style>
</head>
<body>
<div class="top"><div style="display:flex;align-items:center;gap:8px"><img src="/favicon.png?v=hx2" alt=""><b>AiLGNS</b></div><span class="st wait" id="st"><i></i><span>检测网址…</span></span></div>

<main>
  <section class="hero">
    <h1>AiLGNS 永久发布页</h1>
    <p>网址被封、打不开，就来这里。<b>请收藏本页 · 别删 App</b></p>
  </section>

  <a class="enter" id="full" href="/#/otc?full=1">🚀 立即进入网站<small id="enter-sub">自动选能打开的网址</small></a>

  <section class="sec">
    <h2>全部网址 · 绿点能用 · 点「复制」粘到钱包浏览器打开</h2>
    <div class="doms" id="doms"></div>
  </section>

  <section class="grp">
    <h2>💬 加 OTC 交流群</h2>
    <img class="qr" src="/icons/otc-group-qr.png?v=1" alt="OTC 交流群二维码">
    <p class="foot"><b>长按二维码保存</b> → 打开 DeBox → 扫一扫 → 相册选图<br>网址全被封时，群里第一时间发新网址</p>
  </section>

  <section class="sec">
    <form class="ask" id="ask">
      <input id="q" placeholder="有问题问客服，例如：怎么挂单" autocomplete="off" enterkeyhint="send">
      <div class="row"><span class="hint">AI 客服秒回，答不了转人工工单</span><button type="submit">问客服</button></div>
    </form>
  </section>
  <section class="sec">
    <h2>要连钱包交易 · 点图标直接在钱包里打开</h2>
    <div class="wl" id="wl"></div>
  </section>

  <span id="hi" hidden></span>
</main>

<div class="toast" id="toast"></div>
<script src="/app-shell.js?v=8"></script>
</body>
</html>
