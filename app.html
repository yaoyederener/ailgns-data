<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AiLGNS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png?v=hx2">
<title>AiLGNS</title>
<style>
  /* 极简壳页（站长 2026-11-06：照 Claude 新对话页那种留白、居中、一个输入框）。不依赖主站文件，可离线 */
  :root { --ink: #1f1a33; --muted: #8a80a8; --line: #ece7f7; --purple: #5a35d6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; background: #fff; color: var(--ink); touch-action: manipulation; -webkit-text-size-adjust: 100%; display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom)); }
  .top { display: flex; align-items: center; justify-content: space-between; height: 40px; }
  .top img { width: 28px; height: 28px; border-radius: 8px; }
  .top b { font-size: 14px; color: var(--muted); font-weight: 600; }
  .st { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .st i { width: 8px; height: 8px; border-radius: 50%; background: #d6ccf2; display: inline-block; } .st.ok i { background: #0ecb81; } .st.bad i { background: #f6465d; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 22px; padding: 10px 0 20px; }
  h1 { margin: 0; font-size: 30px; font-weight: 500; letter-spacing: .5px; font-family: "Songti SC", "Noto Serif SC", Georgia, serif; }
  h1 em { font-style: normal; color: var(--purple); }
  .ask { width: 100%; max-width: 520px; border: 1px solid var(--line); border-radius: 22px; padding: 14px 14px 10px; box-shadow: 0 10px 30px rgba(90,53,214,.06); text-align: left; background: #fff; }
  .ask input { width: 100%; border: 0; outline: 0; font-size: 17px; padding: 4px 2px 10px; background: transparent; color: var(--ink); }
  .ask input::placeholder { color: #b3abc9; }
  .ask .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ask .hint { font-size: 12px; color: var(--muted); }
  .ask button { border: 0; border-radius: 999px; background: var(--purple); color: #fff; font-weight: 700; padding: 8px 16px; font-size: 14px; }
  .wl { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 520px; }
  .wl a { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); font-size: 12px; width: 64px; }
  .wl img { width: 48px; height: 48px; border-radius: 14px; box-shadow: 0 4px 12px rgba(31,26,51,.10); background: #fff; }
  .wl span { white-space: nowrap; }
  .ins { max-width: 520px; margin: 0; padding: 10px 14px; border-radius: 14px; background: #fff7d6; border: 1px solid #f5d77a; color: #5a4300; font-size: 13px; line-height: 1.6; text-align: left; }
  .foot { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.7; }
  .foot a { color: var(--purple); text-decoration: none; font-weight: 600; }
  .doms { max-width: 520px; margin: 0 auto; width: 100%; }
  .dom { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 13.5px; }
  .dom i { width: 8px; height: 8px; border-radius: 50%; background: #d6ccf2; flex: none; } .dom.ok i { background: #0ecb81; } .dom.bad i { background: #f6465d; opacity: .6; } .dom.wait i { animation: blink 1s infinite; }
  .dom.bad { color: var(--muted); } .dom.hot { background: #f6f1ff; border-radius: 10px; }
  .dom .h { flex: 1; text-align: left; } .dom button { border: 1px solid var(--line); background: #fff; color: var(--purple); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  @keyframes blink { 50% { opacity: .3; } }
  details { max-width: 520px; margin: 0 auto; width: 100%; } summary { cursor: pointer; font-size: 13px; color: var(--muted); text-align: center; list-style: none; padding: 6px; } summary::-webkit-details-marker { display: none; }
  .qr { display: block; width: 180px; margin: 10px auto 4px; border-radius: 14px; border: 1px solid var(--line); }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #1f1a33; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.grp{margin:14px 0;padding:16px 14px;border-radius:16px;background:#fff;border:2px solid #d9c9ff;text-align:center}.grp h2{margin:0 0 10px;font-size:17px;color:#5a35d6}.grp .qr{display:block;margin:0 auto;width:200px;height:auto;border-radius:12px}
</style>
</head>
<body>
<div class="top"><div style="display:flex;align-items:center;gap:8px"><img src="/favicon.png?v=hx2" alt=""><b>AiLGNS</b></div><span class="st wait" id="st"><i></i><span>检测网址…</span></span></div>

<main>
  <h1>您好，<em id="hi">欢迎回来</em></h1>
  <form class="ask" id="ask">
    <input id="q" placeholder="有问题？直接问客服，例如：怎么挂单" autocomplete="off" enterkeyhint="send">
    <div class="row"><span class="hint">AI 客服秒回，答不了转人工工单</span><button type="submit">问客服</button></div>
  </form>
  <div class="wl" id="wl"></div>
  <p class="foot">交易、挂单、查单都在钱包里做 · 点上面图标直接进</p>
  <p class="ins">🛡 <b>失联保险</b>：网站被封、被墙的时候，<b>只有这个 App 和交流群能找到我们</b>。别删它，它永远知道新网址。</p>
</main>

<div class="doms" id="doms"></div>
<section class="grp">
  <h2>💬 加 OTC 交流群</h2>
  <img class="qr" src="/icons/otc-group-qr.png?v=1" alt="OTC 交流群二维码">
  <p class="foot"><b>长按二维码保存</b> → 打开 DeBox → 扫一扫 → 相册选图<br>网站全被封时，群里第一时间发新网址</p>
</section>
<p class="foot" style="text-align:center"><a id="full" href="/#/otc?full=1">在这里浏览网站</a></p>
<div class="toast" id="toast"></div>
<script src="/app-shell.js?v=2"></script>
</body>
</html>
