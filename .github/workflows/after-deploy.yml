name: 上线后体检
# 每次推 main（正式站）或 sig-preview（预览站）后自动跑：
#   等新版本上线 → 无头浏览器按手机宽度把主要页面走一遍（tools/healthcheck.mjs）→ 正式站再盯 10 分钟客户报错。
# 正式站不通过：把代码退回到这次推送之前的样子（自动提交「自动退回：…」），并提醒站长。
# 预览站只出报告、不退回（提交说明里带 [演练退回] 才在预览站演练一次退回）。
# 红线：不碰任何合约、钱包、私钥。唯一可选的密钥 FEEDBACK_KEY 只用来给站长收件箱发一条提醒，没配也照常体检和退回。
on:
  push:
    branches: [main, sig-preview]
concurrency:
  group: after-deploy-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, '自动退回') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MSG: ${{ github.event.head_commit.message }}
      BEFORE: ${{ github.event.before }}
      FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: 定好查哪个站
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then BASE=https://ailgns.dev; MODE=live; NAME=正式站
          else BASE=https://sig-preview.ailgns-data.pages.dev; MODE=preview; NAME=预览站; fi
          WANT=$(grep -o 'core.js?v=h[0-9a-f]*' index.html | head -1 | sed 's/.*v=//')
          DRILL=0; case "$MSG" in *"[演练退回]"*) [ "$MODE" = preview ] && DRILL=1;; esac
          { echo "BASE=$BASE"; echo "MODE=$MODE"; echo "NAME=$NAME"; echo "WANT=$WANT"; echo "DRILL=$DRILL"; } >> "$GITHUB_ENV"
          echo "$NAME $BASE 要等的版本 $WANT 演练=$DRILL"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 装无头浏览器
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: 等新版本上线
        id: wait
        run: |
          sleep 60
          OK=0
          for i in $(seq 1 36); do
            if curl -s -m 20 "$BASE/?x=$RANDOM$i" | grep -q "core.js?v=$WANT"; then OK=1; break; fi
            sleep 10
          done
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          if [ "$OK" = 0 ]; then echo "::warning title=没上线::$NAME 等了 7 分钟还不是版本 $WANT，多半是 Cloudflare 没部署成功。站上还是旧版本，不用退回。"; fi

      - name: 把主要页面走一遍
        id: walk
        if: steps.wait.outputs.ok == '1'
        run: |
          set +e
          # 体检脚本的退出码：0 通过，3 不通过，其它数字 = 体检自己坏了（没装好、脚本丢了）。只有 3 才会退回，体检自己坏了绝不退回网站
          BASE=$BASE TAG=$NAME WANT_CORE=$WANT HC_OUT=$RUNNER_TEMP/hc.json node tools/healthcheck.mjs; RC=$?
          if [ "$RC" = 3 ]; then
            echo "第一遍不通过，隔 30 秒再走一遍，两遍都不过才算"
            sleep 30
            BASE=$BASE TAG="$NAME 第二遍" WANT_CORE=$WANT HC_OUT=$RUNNER_TEMP/hc.json node tools/healthcheck.mjs; RC=$?
          fi
          case "$MSG" in *"[看正式站]"*) [ "$MODE" = preview ] && { BASE=https://ailgns.dev TAG=正式站基线 node tools/healthcheck.mjs; true; };; esac
          WHY=""; FAIL=0; BROKEN=0
          if [ "$RC" = 3 ]; then FAIL=1; WHY="体检不通过（页面走查发现程序报错、白屏或脚本加载失败）"
          elif [ "$RC" != 0 ]; then BROKEN=1; echo "::warning title=体检自己出了故障::体检脚本没跑起来（退出码 $RC），这次判断不了好坏，不退回网站"; fi
          if [ "$DRILL" = 1 ]; then FAIL=1; WHY="演练：假装体检不通过"; fi
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "broken=$BROKEN" >> "$GITHUB_OUTPUT"
          echo "WHY=$WHY" >> "$GITHUB_ENV"
          exit 0

      - name: 正式站再盯 10 分钟客户报错
        id: watch
        if: steps.wait.outputs.ok == '1' && steps.walk.outputs.fail == '0' && env.MODE == 'live'
        run: |
          FAIL=0; N=0
          for i in $(seq 1 10); do
            sleep 60
            N=$(curl -s -m 20 "$BASE/api/err?count=$WANT" | python3 -c 'import sys,json; print(int(json.load(sys.stdin).get("n",0)))' 2>/dev/null || echo 0)
            echo "第 $i 分钟：新版本客户报错累计 $N 次"
            if [ "$N" -ge 3 ]; then FAIL=1; break; fi
          done
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          if [ "$FAIL" = 1 ]; then echo "WHY=上线后 10 分钟内，客户浏览器在新版本上报了 $N 次程序错误" >> "$GITHUB_ENV"; echo "::error title=客户报错暴涨::新版本 $WANT 上线后客户报错 $N 次"
          else echo "::notice title=盯了 10 分钟::新版本 $WANT 客户报错累计 $N 次，没到 3 次的线"; fi

      - name: 不通过就退回
        id: back
        if: steps.wait.outputs.ok == '1' && (steps.walk.outputs.fail != '0' || steps.watch.outputs.fail == '1') && (env.MODE == 'live' || env.DRILL == '1')
        run: |
          BR=$GITHUB_REF_NAME
          echo "rolled=0" >> "$GITHUB_OUTPUT"
          git fetch -q --depth=1 origin "$BR"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then echo "::warning title=没退回::$BR 已经有更新的提交，这次不退回，免得把新改动一起退掉"; exit 0; fi
          case "$BEFORE" in ""|0000000*) echo "::warning title=没退回::找不到上一个版本"; exit 0;; esac
          git fetch -q --depth=1 origin "$BEFORE"
          git config user.name "ailgns-autocheck"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree --reset -u "$BEFORE"
          # 体检流程和体检脚本自己不跟着退（退掉了下一次上线就没人体检了）
          git checkout -q "$GITHUB_SHA" -- .github tools/healthcheck.mjs
          if git diff --cached --quiet; then echo "::warning title=没退回::和上一个版本没有差别，没什么可退的"; exit 0; fi
          git commit -q -m "自动退回：$WHY（退回到 ${BEFORE:0:7}，出问题的提交 ${GITHUB_SHA:0:7}）"
          git push -q origin HEAD:"$BR"
          echo "rolled=1" >> "$GITHUB_OUTPUT"
          OLD=$(git show "$BEFORE":index.html | grep -o 'core.js?v=h[0-9a-f]*' | head -1 | sed 's/.*v=//')
          BACK=0; sleep 45
          for i in $(seq 1 30); do
            if curl -s -m 20 "$BASE/?x=$RANDOM$i" | grep -q "core.js?v=$OLD"; then BACK=1; break; fi
            sleep 10
          done
          echo "confirmed=$BACK" >> "$GITHUB_OUTPUT"
          echo "::error title=已自动退回::$NAME 已退回到 ${BEFORE:0:7}（版本 $OLD）。原因：$WHY。站上确认换回旧版本：$([ "$BACK" = 1 ] && echo 是 || echo 还没看到)"

      - name: 提醒站长
        # 2026-11-25：被新的一次推送顶掉（取消）的体检不发提醒。以前会误报「体检不通过，原因：（空）」——
        #   取消时「等新版本上线」那一步还没跑完，它的结果是空的，而空 == '0' 在这里会被当成真；新的那次推送自己会体检，不用这次来报
        if: ${{ !cancelled() && env.MODE == 'live' && (steps.wait.outputs.ok == '0' || steps.walk.outputs.fail == '1' || steps.walk.outputs.broken == '1' || steps.watch.outputs.fail == '1') }}
        env:
          ROLLED: ${{ steps.back.outputs.rolled }}
          CONFIRMED: ${{ steps.back.outputs.confirmed }}
          DEPLOYED: ${{ steps.wait.outputs.ok }}
          BROKEN: ${{ steps.walk.outputs.broken }}
          WATCHFAIL: ${{ steps.watch.outputs.fail }}
        run: |
          if [ -z "$FEEDBACK_KEY" ]; then echo "没配 FEEDBACK_KEY，发不了站内提醒（GitHub 会给账号邮箱发失败邮件）"; exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          sha = os.environ.get("GITHUB_SHA", "")[:7]
          if os.environ.get("DEPLOYED") == "0":
              msg = "⚠️ 上线后体检：刚推的版本（提交 %s）等了 7 分钟没上线，多半是 Cloudflare 没部署成功。正式站还是旧版本，客户不受影响。" % sha
          elif os.environ.get("BROKEN") == "1" and os.environ.get("WATCHFAIL") != "1":
              msg = "⚠️ 上线后体检：体检脚本自己没跑起来（提交 %s），这次没法判断新版本好坏。网站没有被退回，客户报错那 10 分钟照常盯过。请让技术人员看一下体检流程。" % sha
          else:
              hc = ""
              try: hc = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "hc.json"))).get("text", "")
              except Exception: pass
              rolled = os.environ.get("ROLLED") == "1"
              msg = "🚨 上线后体检不通过（提交 %s）。原因：%s。%s\n%s" % (
                  sha, os.environ.get("WHY", ""),
                  ("已自动退回到上一个版本" + ("，站上已确认换回。" if os.environ.get("CONFIRMED") == "1" else "，站上还没看到换回，请留意。")) if rolled else "没有自动退回（分支上已有更新的提交），请尽快看一下。",
                  hc[:700])
          req = urllib.request.Request("https://ailgns.dev/api/notify-owner", data=json.dumps({"key": os.environ["FEEDBACK_KEY"], "msg": msg[:1150]}).encode(), headers={"content-type": "application/json", "user-agent": "ailgns-autocheck"})
          try: print(urllib.request.urlopen(req, timeout=30).read()[:80])
          except Exception as e: print("提醒没发出去：", str(e)[:80])
          PY

      - name: 结论
        if: always()
        run: |
          if [ "${{ steps.wait.outputs.ok }}" = "0" ]; then echo "没上线"; exit 1; fi
          if [ "${{ steps.walk.outputs.fail }}" != "0" ] || [ "${{ steps.watch.outputs.fail }}" = "1" ]; then echo "不通过：$WHY"; exit 1; fi
          if [ "${{ steps.walk.outputs.broken }}" = "1" ]; then echo "体检自己出了故障，没判断"; exit 1; fi
          echo "通过"
